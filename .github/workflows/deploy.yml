name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]       # change to master if that is your branch name
  workflow_dispatch:         # allows manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install WASM tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish ThreeChartDemo/ThreeChartDemo.csproj -c Release -o release

      # A project site lives under /ThreeChartDemo/, so the base href must match.
      - name: Set base href
        run: sed -i 's|<base href="/" />|<base href="/ThreeChartDemo/" />|' release/wwwroot/index.html

      # Make sure GitHub does not process the site with Jekyll (it would hide _framework).
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
